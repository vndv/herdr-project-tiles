id = "vndv.project-tiles"
name = "Project Tiles"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Tile dashboard of projects: git status, languages, collections, live agent status; opens projects as workspaces"
platforms = ["macos", "linux"]

# Only for `herdr plugin install` from GitHub; `plugin link` does not run it (build yourself).
[[build]]
command = ["cargo", "build", "--release", "--locked"]

# The dashboard: a full-screen overlay over the current tab.
[[panes]]
id = "tiles"
title = "Project Tiles"
placement = "overlay"
command = ["./target/release/project-tiles", "tui"]

# Bound in config.toml:  type = "plugin_action", command = "vndv.project-tiles.open"
[[actions]]
id = "open"
title = "Project Tiles: open dashboard"
contexts = ["global", "workspace", "tab", "pane"]
command = ["./target/release/project-tiles", "open"]

[[actions]]
id = "add-current"
title = "Project Tiles: add current folder"
contexts = ["workspace", "tab", "pane"]
command = ["./target/release/project-tiles", "add-current"]

# Spaces sidebar tokens ($pt_project, $pt_git, $pt_langs, $pt_id).
[[events]]
on = "workspace.created"
command = ["./target/release/project-tiles", "tag"]

[[startup]]
command = ["./target/release/project-tiles", "tag"]
