[package]
name = "project-tiles"
version = "0.2.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
